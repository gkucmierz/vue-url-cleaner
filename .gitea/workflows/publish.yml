name: Test & Dual-Publish Package (vue-url-cleaner -> Gitea + NPM)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    uses: gkucmierz/ci-workflows/.gitea/workflows/publish-package.yml@main
    with:
      runs_on: self-hosted-pl
      run_tests: true
      run_build: false
      publish_private: true
      publish_npmjs: true
    secrets: inherit
